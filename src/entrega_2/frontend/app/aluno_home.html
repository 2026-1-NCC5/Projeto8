<!DOCTYPE html>

<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-bright": "#f7f9fc",
            "on-primary": "#ffffff",
            "surface-container-low": "#f2f4f7",
            "error-container": "#ffdad6",
            "on-tertiary": "#ffffff",
            "on-primary-container": "#004b1e",
            "on-error-container": "#93000a",
            "surface-container": "#eceef1",
            "on-tertiary-fixed": "#410001",
            "surface-variant": "#e0e3e6",
            "on-secondary-container": "#24703e",
            "on-surface": "#191c1e",
            "surface-container-highest": "#e0e3e6",
            "surface": "#f7f9fc",
            "surface-tint": "#006e2f",
            "surface-container-high": "#e6e8eb",
            "secondary": "#1f6c3a",
            "secondary-container": "#a4f1b2",
            "on-secondary-fixed": "#00210b",
            "inverse-primary": "#4ae176",
            "tertiary-container": "#ff8b7c",
            "inverse-surface": "#2d3133",
            "secondary-fixed-dim": "#8bd79b",
            "on-surface-variant": "#3d4a3d",
            "on-tertiary-container": "#76231b",
            "surface-dim": "#d8dadd",
            "tertiary": "#9e4036",
            "error": "#ba1a1a",
            "tertiary-fixed-dim": "#ffb4a9",
            "on-background": "#191c1e",
            "primary-container": "#22c55e",
            "on-tertiary-fixed-variant": "#7f2a21",
            "on-secondary": "#ffffff",
            "on-error": "#ffffff",
            "primary-fixed-dim": "#4ae176",
            "secondary-fixed": "#a6f4b5",
            "on-secondary-fixed-variant": "#005226",
            "primary-fixed": "#6bff8f",
            "primary": "#006e2f",
            "outline-variant": "#bccbb9",
            "inverse-on-surface": "#eff1f4",
            "on-primary-fixed-variant": "#005321",
            "outline": "#6d7b6c",
            "tertiary-fixed": "#ffdad5",
            "surface-container-lowest": "#ffffff",
            "on-primary-fixed": "#002109",
            "background": "#f7f9fc"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "fontFamily": {
            "headline": ["Manrope"],
            "body": ["Inter"],
            "label": ["Inter"]
          }
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    body {
      font-family: 'Inter', sans-serif;
    }

    h1,
    h2,
    h3,
    .font-headline {
      font-family: 'Manrope', sans-serif;
    }
  </style>
</head>

<body class="bg-surface text-on-surface min-h-screen">
  <!-- TopNavBar -->
  <nav class="fixed top-0 w-full z-50 bg-white/70 backdrop-blur-md shadow-sm">
    <div class="flex justify-between items-center px-6 h-16 w-full max-w-screen-2xl mx-auto">
      <div class="flex items-center gap-8">
        <span class="text-xl font-bold tracking-tight text-green-800">Lideranças Empáticas</span>
        <div class="hidden md:flex gap-6 items-center">
          <a class="text-green-700 border-b-2 border-green-600 pb-1 font-manrope text-sm font-medium transition-colors"
            href="#">Home</a>
          <a class="btn-dashboard text-sm font-semibold text-on-surface-variant hover:text-primary transition-colors cursor-pointer">Dashboard</a>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="relative">
          <button id="btn-avatar-menu" class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container font-bold text-xs cursor-pointer hover:ring-2 hover:ring-primary/40 transition-all">
            ..
          </button>
          <div id="avatar-dropdown" class="hidden absolute right-0 top-12 w-48 bg-white rounded-xl shadow-[0_20px_40px_rgba(25,28,30,0.12)] border border-slate-100 py-2 z-[200]">
            <a class="btn-perfil flex items-center gap-3 px-4 py-3 text-sm font-medium text-on-surface hover:bg-surface-container-low transition-colors cursor-pointer">
              <span class="material-symbols-outlined text-lg text-on-surface-variant">person</span> Perfil
            </a>
            <hr class="my-1 border-slate-100" />
            <a class="btn-sair flex items-center gap-3 px-4 py-3 text-sm font-medium text-error hover:bg-error-container/20 transition-colors cursor-pointer">
              <span class="material-symbols-outlined text-lg">logout</span> Sair
            </a>
          </div>
        </div>
      </div>
    </div>
  </nav>
  <main class="pt-24 pb-20 px-6 max-w-screen-2xl mx-auto">
    <!-- Welcome Hero Section -->
    <header class="mb-16">
      <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
        <div>
          <span class="text-primary font-semibold tracking-wider text-xs uppercase mb-2 block">Portal do Aluno</span>
          <h1 id="titulo-boas-vindas" class="text-5xl font-extrabold text-on-surface tracking-tight mb-2">Bem-vindo(a)!</h1>
          <p id="nome-equipe" class="text-3xl font-extrabold text-primary tracking-tight mb-4 font-headline"></p>
          <p class="text-on-surface-variant max-w-xl text-lg leading-relaxed">
            Sua jornada de liderança empática continua aqui. Colabore com sua equipe para
            desenvolver autoridade com humanidade.
          </p>
        </div>
        <div class="bg-surface-container-low px-6 py-4 rounded-xl flex items-center gap-4">
          <div class="w-12 h-12 bg-primary-container/20 rounded-full flex items-center justify-center text-primary">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">verified_user</span>
          </div>
          <div>
            <p class="text-[10px] text-on-surface-variant uppercase font-bold tracking-widest">Status da Conta</p>
            <p class="font-semibold text-primary">Estudante Verificado</p>
          </div>
        </div>
      </div>
    </header>
    <!-- Semesters Grid — renderizado dinamicamente -->
    <section>
      <div class="flex items-center justify-between mb-8">
        <h2 class="text-2xl font-bold tracking-tight text-on-surface">Seus Semestres</h2>
        <div class="h-px bg-surface-container-high flex-grow mx-8 hidden md:block"></div>
        <span id="contador-semestres" class="text-sm font-medium text-on-surface-variant"></span>
      </div>
      <div id="semestres-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div class="col-span-3 flex justify-center py-16">
          <div style="border:3px solid #e0e3e6;border-top-color:#006e2f;border-radius:50%;width:36px;height:36px;animation:spin .7s linear infinite;"></div>
        </div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </section>
  </main>
  <!-- BottomNavBar (Mobile Only) -->
  <nav
    class="lg:hidden fixed bottom-0 left-0 w-full bg-white flex justify-around items-center px-4 py-3 pb-safe z-50 shadow-[0_-4px_12px_rgba(0,0,0,0.05)] rounded-t-2xl">
    <div class="flex flex-col items-center justify-center bg-green-100 text-green-800 rounded-xl px-4 py-1">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
      <span class="text-[10px] font-manrope font-semibold">Home</span>
    </div>
    <button class="btn-dashboard flex flex-col items-center justify-center text-slate-400 active:bg-slate-50 transition-transform active:scale-90 cursor-pointer">
      <span class="material-symbols-outlined">bar_chart</span>
      <span class="text-[10px] font-manrope font-semibold">Dashboard</span>
    </button>
    <button class="btn-perfil flex flex-col items-center justify-center text-slate-400 active:bg-slate-50 transition-transform active:scale-90 cursor-pointer">
      <span class="material-symbols-outlined">person</span>
      <span class="text-[10px] font-manrope font-semibold">Perfil</span>
    </button>
  </nav>
  <script>
    const API_BASE = window._API_BASE || 'http://localhost:8000/api';
    const TOKEN    = window._TOKEN || '';

    const avatarBtn = document.getElementById('btn-avatar-menu');
    const dropdown = document.getElementById('avatar-dropdown');
    avatarBtn.addEventListener('click', (e) => { e.stopPropagation(); dropdown.classList.toggle('hidden'); });
    document.addEventListener('click', () => dropdown.classList.add('hidden'));
    dropdown.addEventListener('click', (e) => e.stopPropagation());

    // ── Carregar dados do aluno ─────────────────────────
    async function carregarDados() {
      try {
        // Dados do usuário
        const resUser = await fetch(API_BASE + '/usuarios/me', {
          headers: { 'Authorization': 'Bearer ' + TOKEN }
        });
        if (resUser.ok) {
          const user = await resUser.json();
          const nome = (user.nome || 'Aluno').split(' ')[0];
          document.getElementById('titulo-boas-vindas').textContent = 'Bem-vinda, ' + nome + '.';
          const initials = (user.nome || '').split(' ').map(p => p[0]).join('').substring(0, 2).toUpperCase();
          document.getElementById('btn-avatar-menu').textContent = initials;
        }

        // Equipe do aluno
        try {
          const resEquipe = await fetch(API_BASE + '/equipes/minha', {
            headers: { 'Authorization': 'Bearer ' + TOKEN }
          });
          if (resEquipe.ok) {
            const equipe = await resEquipe.json();
            document.getElementById('nome-equipe').textContent = equipe.nome;
          }
        } catch (_) {}

        // Semestres
        const resSem = await fetch(API_BASE + '/semestres', {
          headers: { 'Authorization': 'Bearer ' + TOKEN }
        });
        if (resSem.ok) {
          const semestres = await resSem.json();
          renderizarSemestres(semestres);
        }
      } catch (_) {
        document.getElementById('semestres-grid').innerHTML = '<p class="col-span-3 text-center text-error text-sm py-8">Erro ao carregar dados.</p>';
      }
    }

    function renderizarSemestres(semestres) {
      const grid = document.getElementById('semestres-grid');
      grid.innerHTML = '';

      document.getElementById('contador-semestres').textContent = 'Exibindo ' + semestres.length + ' período' + (semestres.length !== 1 ? 's' : '') + ' acadêmico' + (semestres.length !== 1 ? 's' : '');

      semestres.forEach(function(s) {
        const card = document.createElement('div');

        if (s.status === 'ativo') {
          card.className = 'flex flex-col h-full bg-surface-container-lowest p-8 rounded-[1.5rem] shadow-[0_20px_40px_rgba(25,28,30,0.04)] relative ring-2 ring-primary';

          const contentDiv = document.createElement('div');
          contentDiv.className = 'flex-grow';

          const badge = document.createElement('div');
          badge.className = 'absolute top-6 right-8 px-3 py-1 bg-primary-container text-on-primary-container text-[10px] font-bold rounded-full uppercase tracking-tighter';
          badge.textContent = 'Ativo';
          contentDiv.appendChild(badge);

          const body = document.createElement('div');
          body.className = 'mb-6 mt-4 md:mt-0';
          const h3 = document.createElement('h3');
          h3.className = 'text-2xl font-extrabold text-on-surface';
          h3.textContent = 'Semestre ' + s.nome;
          body.appendChild(h3);
          contentDiv.appendChild(body);

          const info = document.createElement('div');
          info.className = 'space-y-4 mb-8';
          info.innerHTML = '<div class="flex items-center gap-3 text-on-surface-variant text-sm"><span class="material-symbols-outlined text-sm">calendar_month</span><span>Período: ' + s.periodo + '</span></div>';
          contentDiv.appendChild(info);

          card.appendChild(contentDiv);

          const btn = document.createElement('a');
          btn.className = 'btn-acessar-equipe flex items-center justify-center w-full bg-gradient-to-br from-primary to-secondary text-white py-4 px-6 rounded-xl font-bold tracking-tight hover:opacity-90 transition-all group cursor-pointer';
          btn.innerHTML = 'Acessar Minha Equipe <span class="material-symbols-outlined ml-2 transition-transform group-hover:translate-x-1">arrow_forward</span>';
          card.appendChild(btn);
        } else {
          card.className = 'flex flex-col h-full bg-surface-container-low p-8 rounded-[1.5rem] grayscale opacity-70 hover:grayscale-0 hover:opacity-100 transition-all';

          const contentDiv = document.createElement('div');
          contentDiv.className = 'flex-grow';

          const body = document.createElement('div');
          body.className = 'mb-6';
          const h3 = document.createElement('h3');
          h3.className = 'text-2xl font-extrabold text-on-surface';
          h3.textContent = 'Semestre ' + s.nome;
          body.appendChild(h3);
          contentDiv.appendChild(body);

          const info = document.createElement('div');
          info.className = 'space-y-4 mb-8 text-on-surface-variant';
          info.innerHTML = '<div class="flex items-center gap-3 text-sm"><span class="material-symbols-outlined text-sm">check_circle</span><span>Concluído</span></div>';
          contentDiv.appendChild(info);

          card.appendChild(contentDiv);
        }

        grid.appendChild(card);
      });

      // Bind navigation for dynamically created buttons
      grid.querySelectorAll('.btn-acessar-equipe').forEach(function(el) {
        el.addEventListener('click', function(e) {
          e.preventDefault();
          if (typeof setComponentValue === 'function') setComponentValue('aluno_minha_equipe');
        });
      });

      // Adjust height in Streamlit
      setTimeout(() => {
        if (typeof sendMessageToStreamlitClient === 'function') {
          sendMessageToStreamlitClient("streamlit:setFrameHeight", {height: document.documentElement.scrollHeight + 50});
        }
      }, 50);
    }

    carregarDados();
  </script>
</body>

</html>
